<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTA AI - Gerador de Cortes Grátis</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-white flex items-center justify-center min-h-screen">
    <div class="text-center">
        <h1 class="text-4xl font-bold text-cyan-400 mb-4">⚡ CORTA AI</h1>
        <p class="mb-8">Transforme vídeos longos em 10 cortes virais em 1 minuto</p>
        
        <div class="bg-[#1a1a2e] p-8 rounded-2xl">
            <h2 class="text-2xl font-bold mb-2">Gerador de Cortes GRÁTIS</h2>
            <p class="mb-6">Cole o link do YouTube e receba 10 ideias de cortes</p>
            <input type="text" placeholder="https://youtube.com/watch?v=..." 
                   class="w-full p-3 rounded-lg bg-[#0a0a0a] border border-cyan-400 mb-4">
            <button class="bg-cyan-400 text-black font-bold px-8 py-3 rounded-lg">
                GERAR 10 CORTES AGORA
            </button>
        </div>
    </div>
</body>
</html><script>
function gerarCortes() {
    const link = document.querySelector('input').value;
    if(!link) {
        alert('Cola um link do YouTube primeiro!');
        return;
    }
    
    const container = document.querySelector('.bg-\\[\\#1a1a2e\\]');
    container.innerHTML += `
        <div id="resultados" class="mt-8 text-left">
            <h3 class="text-xl font-bold mb-4 text-cyan-400">⚡ 10 Ideias de Cortes Virais:</h3>
            
            <div class="bg-[#0a0a0a] p-4 rounded-lg mb-3">
                <p class="font-bold">1. O Segredo que ninguém te conta</p>
                <p class="text-sm text-gray-400">00:01:23 - 00:01:45 | Gancho: "Presta atenção nisso..."</p>
            </div>
            <div class="bg-[#0a0a0a] p-4 rounded-lg mb-3">
                <p class="font-bold">2. O Erro que está te travando</p>
                <p class="text-sm text-gray-400">00:03:10 - 00:03:32 | Gancho: "Você está fazendo errado"</p>
            </div>
            <div class="bg-[#0a0a0a] p-4 rounded-lg mb-3">
                <p class="font-bold">3. A Técnica de R$10 mil</p>
                <p class="text-sm text-gray-400">00:05:44 - 00:06:05 | Gancho: "Nunca vi ninguém fazer isso"</p>
            </div>
            <div class="bg-[#0a0a0a] p-4 rounded-lg mb-3">
                <p class="font-bold">4. O que eu faria diferente</p>
                <p class="text-sm text-gray-400">00:07:21 - 00:07:50 | Gancho: "Se eu pudesse voltar no tempo..."</p>
            </div>
            <div class="bg-[#0a0a0a] p-4 rounded-lg mb-3">
                <p class="font-bold">5. A Verdade dura</p>
                <p class="text-sm text-gray-400">00:09:15 - 00:09:40 | Gancho: "Vou ser sincero com você"</p>
            </div>
            
            <p class="text-center text-sm text-gray-500 mt-4">+ 5 cortes gerados. Isso é uma demo. Quer a IA real me chama!</p>
        </div>
    `;
}

// Faz o botão chamar a função
document.querySelector('button').onclick = gerarCortes;
</script>
