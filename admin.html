<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corta AI - Gerador de Cortes</title>
<style>
  body{background:#0a0a0a;color:#fff;font-family:Arial;padding:40px;text-align:center;}
  h1{color:#00ff88;font-size:32px;}
  .cartao{background:#1a1a1a;padding:30px;border-radius:12px;margin:30px auto;max-width:600px;}
  input{padding:14px; width:90%; max-width:500px; margin:15px 0; border-radius:8px; border:2px solid #00ff88; background:#111; color:white; font-size:16px;}
  button{padding:16px 32px; background:#00ff88; color:#000; font-weight:bold; border:none; border-radius:8px; cursor:pointer; font-size:18px; margin:10px;}
  button:disabled{background:#555; cursor:not-allowed;}
  #resultado{background:#222; padding:15px; border-radius:8px; margin-top:20px; text-align:left; display:none;}
  .corte-item{background:#333; padding:10px; margin:8px 0; border-radius:6px; border-left:3px solid #00ff88;}
</style>
</head>
<body>

<h1>⚡ CORTA AI</h1>
<p>Transforme vídeos longos em 10 cortes virais em 1 minuto</p>

<div class="cartao">
  <h2>Gerador de Cortes GRÁTIS</h2>
  <p>Cole o link do YouTube e receba 10 ideias de cortes</p>
  
  <input id="input-youtube" placeholder="https://youtube.com/watch?v=..." />
  <br>
  <button id="btn-gerar">GERAR 10 CORTES AGORA</button>
  
  <div id="resultado">
    <h3>Seus 10 Cortes:</h3>
    <div id="lista-cortes"></div>
  </div>
</div>

<script>
document.getElementById("btn-gerar").addEventListener("click", async () => {
  const link = document.getElementById("input-youtube").value
  if(!link) return alert("Cola um link do YouTube primeiro")

  document.getElementById("btn-gerar").innerText = "Gerando cortes... aguarde 1 min"
  document.getElementById("btn-gerar").disabled = true
  document.getElementById("resultado").style.display = "none"

  try {
    const res = await fetch("https://caiqueluk.app.n8n.cloud/webhook/cortai", {
      method: "POST", 
      headers: {"Content-Type": "application/json"}, 
      body: JSON.stringify({ youtube_url: link })
    })
    
    const cortes = await res.json()

    const lista = document.getElementById("lista-cortes")
    lista.innerHTML = ""
    cortes.forEach((c, i) => {
      lista.innerHTML += `<div class="corte-item"><b>Corte ${i+1}:</b> ${c.titulo || c}</div>`
    })
    
    document.getElementById("resultado").style.display = "block"
    
  } catch(e) {
    alert("Deu erro. Verifica se o n8n tá ativo")
  }

  document.getElementById("btn-gerar").innerText = "GERAR 10 CORTES AGORA"
  document.getElementById("btn-gerar").disabled = false
})
</script>
</body>
</html>
